name: Generate App Icons

on:
  push:
    paths:
      - 'scripts/generate_app_icon.py'
      - '.github/workflows/generate-icons.yml'
      - 'ExpenseTracker/Assets.xcassets/AppIcon.appiconset/Contents.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Generate icons
        run: python3 scripts/generate_app_icon.py

      - name: Commit icons if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ExpenseTracker/Assets.xcassets/AppIcon.appiconset/*.png
          if git diff --cached --quiet; then
            echo 'Icons unchanged, nothing to commit.'
          else
            git commit -m 'chore: regenerate app icons [skip ci]'
            git push
          fi
